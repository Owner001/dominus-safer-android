<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dominus Safer</title>
  <style>
    html, body { height:100%; margin:0; background:#0b0b12; color:#e8e6f0; font-family:system-ui,sans-serif; }
    #splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:radial-gradient(ellipse at 50% 30%, #1a1230 0%, #0b0b12 70%); }
    .logo { width:88px; height:88px; border-radius:22px; background:linear-gradient(145deg,#7c3aed,#4c1d95);
      display:flex; align-items:center; justify-content:center; font-weight:800; font-size:28px; margin-bottom:20px;
      box-shadow:0 12px 40px rgba(124,58,237,.35); }
    .title { font-size:20px; font-weight:600; margin-bottom:6px; }
    .sub { font-size:13px; color:#8b83a3; margin-bottom:28px; }
    .bar { width:140px; height:3px; border-radius:99px; background:#1c1c2e; overflow:hidden; }
    .bar > i { display:block; height:100%; width:40%; background:linear-gradient(90deg,#7c3aed,#a78bfa); animation:load 1.1s ease-in-out infinite; }
    @keyframes load { 0%{transform:translateX(-100%)} 100%{transform:translateX(280%)} }
  </style>
</head>
<body>
  <div id="splash"><div class="logo">DS</div><div class="title">Dominus Safer</div><div class="sub">Carregando painel…</div><div class="bar"><i></i></div></div>
</body>
</html>
